<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Luftfartshinder · CORE-6</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles/index.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">
            <div class="container-fluid px-4">
                <a class="navbar-brand ms-2 me-lg-4" href="./index.html#forside" aria-label="CORE-6">
                    <i class="bi bi-6-circle-fill navbar-logo" aria-hidden="true"></i>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav gap-lg-3 ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html#forside">Hjem</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html#om-oss">Om oss</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html#card-section">Medlemmer</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html#prosjekt">Prosjekt</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html#kontakt-oss">Kontakt</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container underside">
            <p class="mb-3">
                <a href="./index.html#prosjekt">← Tilbake til Prosjekt</a>
            </p>
            <h1 class="brand-font mb-3">Luftfartshinder</h1>
            <p class="lead col-lg-8">
                Fordypet informasjon om prosjektet. Modeller, kart og mer innhold kommer her senere.
            </p>

            <section class="mt-5" id="lsp-data">
                <h2 class="h4 mb-3">Velg type</h2>
                <div class="wheel-wrap">
                    <div class="wheel-container"></div>
                    <div class="wheel-pointer" aria-hidden="true"></div>
                    <div class="wheel-hub" aria-hidden="true"></div>
                </div>
                <button type="button" id="spin-btn" class="btn btn-accent mt-3">Spin</button>
                <p id="spin-result" class="mt-2 mb-0"></p>
            </section>

            <section class="mt-5" id="modeller">
                <h2 class="h4">Modeller</h2>
                <p class="text-body-secondary">Kommer senere.</p>
            </section>

            <section class="mt-4" id="kart">
                <h2 class="h4">Kart</h2>
                <p class="text-body-secondary">Kommer senere.</p>
            </section>

            <section class="mt-4" id="informasjon">
                <h2 class="h4">Informasjon</h2>
                <p class="text-body-secondary">Kommer senere.</p>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/spin-wheel@5.0.2/dist/spin-wheel-iife.js"></script>
        <script src="./js/prosjekt-wheel.js"></script>
    </body>
</html>
